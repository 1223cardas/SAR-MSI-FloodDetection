[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-msi-flood-detection"
version = "1.0.0"
description = "Unified flood detection using Sentinel-1 SAR and Sentinel-2 optical data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Diogo Cardoso", email = "diogo.m.cardoso1812@gmail.com" },
    { name = "Paulo Magalhães" }
]
dependencies = [
    "python-dotenv==1.2.2",
    "rasterio==1.4.4",
    "numpy==2.4.4",
]

[project.scripts]
sar-msi = "main:main"

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
py-modules = ["main", "processors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
